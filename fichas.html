<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/SRC/css/fichas_style.css">
    <link rel="stylesheet" href="/SRC/css/header.css">
    <title>Base</title>
</head>

<body id="background">
    <header id="head">
        <article id="header-content">
            <img src=""> <!--Site Logo-->
            <p>S.D</p>
        </article>
        <nav id="header-nav" class="Links-stlyle">

            <a class="Links-stlyle" href="fichas.html">Fichas</a>
            <a class="Links-stlyle" href="campanhas.html">Campanhas</a>
        </nav>
        <img src="alog"> <!--Account-->

    </header>
    <main class="table">

        <section id="Row">
            <section id="header">

                <img src=""> <!--Foto do Personagem-->
                <p>Personagem</p>
                <form id="nomePersonagem" class="CenterNoneBorder2">
                    <input type="text" id="nome" name="nome" placeholder="Nome do Personagem">
                </form>
                <p>Jogador:</p>
                <form id="nomeJogadorForm" class="CenterNoneBorder2">
                    <input type="text" id="jogador" name="jogador" placeholder="Nome do Jogador">
                </form>
                <p>Vontade:</p>
                <form id="nomeVontade" class="CenterNoneBorder2">
                    <input type="text" id="jogador" name="Vontade" placeholder="Vontade do Personagem">
                </form>
                <p>Origem:</p> <!--Vou mudar isso aqui-->
                <form id="nomeOr" class="CenterNoneBorder2">
                    <input type="text" id="jogador" name="Vontade" placeholder="Origem do Personagem">
                </form>

            </section>

            <article id="statusPrincipais" class="diagrama">
                <div class="status hex-top hexagono">

                    <form id="for" class="CenterNoneBorder">
                        <input name="for" type="number" id="forca" value="0">


                    </form>
                    <div class="StatusStlye">
                        <p id="fora">Força</p>
                        <h2>FOR</h2>
                    </div>

                </div>

                <div id="ani" class="status hexagono hex-left">

                    <form class="CenterNoneBorder">
                        <input type="number" id="animo" value="0">
                    </form>
                    <div class="StatusStlye">
                        <p id="anim">Ánimo</p>
                        <h2>Áni</h2>
                    </div>
                </div>

                <div id="int" class="status hexagono hex-right">

                    <form class="CenterNoneBorder">
                        <input type="number" id="intelecto" value="0">
                    </form>
                    <div class="StatusStlye">
                        <p id="intelect">Intelecto</p>
                        <h2>INT</h2>
                    </div>
                </div>

                <div id='car' class="status hexagono hex-bottom-left">

                    <form class="CenterNoneBorder">
                        <input type="number" id="carisma" value="0">
                    </form>
                    <div class="StatusStlye">
                        <p id="carism">Carisma</p>
                        <h2>CAR</h2>
                    </div>
                </div>
                <div class="hexagono hex-center">
                    <span>ATRIBUTOS</span>
                </div>

                <div id="vig" class="status hexagono hex-bottom-right">

                    <form class="CenterNoneBorder">
                        <input type="number" id="vigor" name="vigor" value="0">

                    </form>
                    <div class="StatusStlye">
                        <p id="vigo">Vigor</p>
                        <h2>VIG</h2>
                    </div>
                </div>
            </article>
            <arcticle>
                <h1>PV</h1>
                <div class="barraPV">

                    <div class="fundoPV"></div>

                    <div id="vida" class="preenchimentoPV"></div>

                    <div id="textoPv" class="textoPV"></div>

                </div>

                <form>

                </form>

                <section class="setas">
                    <!-- <form class="CenterNoneBorder">
                    <input type="number" id="inputPv" placeholder="-">
                    </form> -->
                    <div onclick="alterarVida(-10)">◀◀◀</div>
                    <div onclick="alterarVida(-5)">◀◀</div>
                    <div onclick="alterarVida(-1)">◀</div>
                    <div onclick="alterarVida(1)">▶</div>
                    <div onclick="alterarVida(5)">▶▶</div>
                    <div onclick="alterarVida(10)">▶▶▶</div>
                    <!--  <form class="CenterNoneBorder">
                     <input type="number" id="inputPv" placeholder="+">
                     </form> -->
                </section>
                <h1>PE</h1>
                <div class="barraPE">

                    <div class="fundoPE"></div>

                    <div id="pe" class="preenchimentoPE"></div>

                    <div id="textoPe" class="textoPE"></div>

                </div>
                <section class="setas">
                    <!-- <form class="CenterNoneBorder">
                     <input type="number" id="inputPe" placeholder="-">
                    </form> -->
                    <div onclick="alterarEnergia(-10)">◀◀◀</div>
                    <div onclick="alterarEnergia(-5)">◀◀</div>
                    <div onclick="alterarEnergia(-1)">◀</div>
                    <div onclick="alterarEnergia(1)">▶</div>
                    <div onclick="alterarEnergia(5)">▶▶</div>
                    <div onclick="alterarEnergia(10)">▶▶▶</div>
                    <!--  <form class="CenterNoneBorder">
                     <input type="number" id="inputPe" placeholder="+">
                     </form> -->
                </section>
            </arcticle>
        </section>



        <section id="statusAdjuntos">

            <div id="defesa" class="statusAd">
                <p>Defesa: </p>
                <div id="defPontos"> </div>

            </div>
            <div id="reflexo " class="statusAd">
                <p>Reflexo: </p>
                <div id="reflexoPontos"></div>
            </div>
            <div id="iniciativa" class="statusAd">
                <p>Iniciativa: </p>
                <div id="iniciativaPontos"></div>
            </div>
            <div id="coragem " class="statusAd">
                <p>Coragem: </p>
                <div id="coragemPontos"></div>
            </div>
            <div id="precisao" class="statusAd">
                <p>Precisão: </p>
                <div id="precisaoPontos"></div>
            </div>
            <div id="percepcao" class="statusAd">
                <p>Percepção: </p>
                <div id="percepcaoPontos"></div>
            </div>
        </section>
    </main>

        </div>

        <div id="dado10" class="directionDados">D10</div>
        <div id="dado12" class="directionDados">D12</div>
        <div id="dado14" class="directionDados">D14</div>
        <div id="dado16" class="directionDados">D16</div>
        <div id="dado18" class="directionDados">D18</div>
        <div id="dado20" class="directionDados">D20</div>
        <div id="dado100" class="directionDados">D100</div>


    </section>

</body>

</html>
